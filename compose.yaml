services:
  napcat:
    image: m.daocloud.io/docker.io/mlikiowa/napcat-docker:v4.17.25
    environment:
        - NAPCAT_UID=1000
        - NAPCAT_GID=1000
        - MODE=astrbot
    ports:
        - 6099:6099
    container_name: napcat
    restart: always
    volumes:
      - ./.runtime/astrbot/data:/AstrBot/data
      - ./.runtime/napcat/config:/app/napcat/config
      - ./.runtime/napcat/QQ:/app/.config/QQ
    networks:
      - pigpie_network

  astrbot:
    image: m.daocloud.io/docker.io/soulter/astrbot:v4.29.1
    environment:
      - TZ=Asia/Shanghai
    container_name: astrbot
    restart: always
    ports:
      - "6185:6185"
    volumes:
      - ./.runtime/astrbot/data:/AstrBot/data
    networks:
      - pigpie_network

networks:
  pigpie_network:
    driver: bridge
